<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLBB — Все предметы (Полный гайд)</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#f0c040; --orange:#e8783a; --blue:#4a9eff; --green:#4ecb71;
  --purple:#b06aff; --red:#ff4a4a; --teal:#2dd4bf; --pink:#f472b6;
  --dark:#0c0e16; --darker:#07090f; --card:#121520; --card2:#161a26;
  --border:#252a3a; --text:#c0c8dc; --dim:#5a6280; --white:#e8ecf8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--darker);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{background:linear-gradient(180deg,rgba(240,192,64,.1) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:20px 16px 14px;text-align:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);background-color:rgba(7,9,15,.93)}
header h1{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;color:var(--gold);letter-spacing:4px;text-transform:uppercase}
header p{font-size:.68rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:3px}

/* CAT TABS */
.cat-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);background:var(--dark)}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:11px 14px;font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:var(--dim);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.cat-tab:hover{color:var(--text)}
.cat-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.cat-tab[data-cat=magic].active{color:#a78bfa;border-bottom-color:#a78bfa}
.cat-tab[data-cat=defense].active{color:var(--blue);border-bottom-color:var(--blue)}
.cat-tab[data-cat=movement].active{color:var(--teal);border-bottom-color:var(--teal)}
.cat-tab[data-cat=jungle].active{color:var(--green);border-bottom-color:var(--green)}
.cat-tab[data-cat=roam].active{color:var(--orange);border-bottom-color:var(--orange)}
.cat-tab[data-cat=adaptive].active{color:var(--pink);border-bottom-color:var(--pink)}

/* CONTROLS */
.controls{padding:10px 12px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--dark)}
.search-box{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.82rem;outline:none;transition:border-color .2s}
.search-box:focus{border-color:var(--gold)}
.search-box::placeholder{color:var(--dim)}
.role-filters{display:flex;gap:6px;flex-wrap:wrap}
.rf-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:'Exo 2',sans-serif;font-size:.66rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .18s;white-space:nowrap}
.rf-btn:hover,.rf-btn.active{background:var(--gold);color:var(--darker);border-color:var(--gold)}

/* STATS BAR */
.statsbar{padding:6px 14px 10px;font-size:.68rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase;background:var(--dark)}
.statsbar span{color:var(--gold);font-weight:700}

/* GRID */
.grid{display:grid;grid-template-columns:1fr;gap:8px;padding:8px 10px 80px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 12px 10px;display:flex;gap:12px;cursor:pointer;transition:border-color .2s,background .2s;position:relative;overflow:hidden;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card::after{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--gold);opacity:0;transition:opacity .2s}
.card:hover{border-color:rgba(240,192,64,.3);background:var(--card2)}
.card:hover::after,.card.open::after{opacity:1}
.card.open{border-color:rgba(240,192,64,.4);background:var(--card2)}
.card[data-cat=magic]:hover,.card[data-cat=magic].open{border-color:rgba(167,139,250,.35)}
.card[data-cat=magic]::after{background:#a78bfa}
.card[data-cat=defense]:hover,.card[data-cat=defense].open{border-color:rgba(74,158,255,.35)}
.card[data-cat=defense]::after{background:var(--blue)}
.card[data-cat=movement]:hover,.card[data-cat=movement].open{border-color:rgba(45,212,191,.35)}
.card[data-cat=movement]::after{background:var(--teal)}
.card[data-cat=jungle]:hover,.card[data-cat=jungle].open{border-color:rgba(78,203,113,.35)}
.card[data-cat=jungle]::after{background:var(--green)}
.card[data-cat=roam]:hover,.card[data-cat=roam].open{border-color:rgba(232,120,58,.35)}
.card[data-cat=roam]::after{background:var(--orange)}
.card[data-cat=adaptive]:hover,.card[data-cat=adaptive].open{border-color:rgba(244,114,182,.35)}
.card[data-cat=adaptive]::after{background:var(--pink)}

.item-icon{width:52px;height:52px;border-radius:10px;background:#1a1e2c;border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.item-icon img{width:100%;height:100%;object-fit:cover}
.card-body{flex:1;min-width:0}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px}
.iname{font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname-ru{font-size:.7rem;color:var(--dim);margin-bottom:4px;font-style:italic}
.icost{font-size:.68rem;color:var(--gold);font-weight:700;background:rgba(240,192,64,.1);padding:2px 7px;border-radius:10px;flex-shrink:0}
.istats{font-size:.68rem;color:#707898;margin-bottom:5px}
.tier{font-size:.58rem;font-weight:700;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.t3{background:rgba(240,192,64,.12);color:var(--gold)}
.t2{background:rgba(160,160,200,.1);color:#9090c0}
.t1{background:rgba(100,180,100,.1);color:#70b070}
.when{font-size:.78rem;color:var(--text);line-height:1.45}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:.58rem;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tag-mm{background:rgba(232,120,58,.14);color:#e8783a;border:1px solid rgba(232,120,58,.3)}
.tag-fighter{background:rgba(192,57,43,.14);color:#e74c3c;border:1px solid rgba(192,57,43,.3)}
.tag-ass{background:rgba(176,106,255,.14);color:#b06aff;border:1px solid rgba(176,106,255,.3)}
.tag-tank{background:rgba(74,158,255,.14);color:#4a9eff;border:1px solid rgba(74,158,255,.3)}
.tag-mage{background:rgba(167,139,250,.14);color:#a78bfa;border:1px solid rgba(167,139,250,.3)}
.tag-sup{background:rgba(78,203,113,.14);color:#4ecb71;border:1px solid rgba(78,203,113,.3)}
.tag-jng{background:rgba(45,212,191,.14);color:#2dd4bf;border:1px solid rgba(45,212,191,.3)}
.detail{display:none;margin-top:9px;padding:9px 11px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;font-size:.73rem;color:#8892b0;line-height:1.5}
.detail strong{color:var(--gold)}
.card.open .detail{display:block}
.hint{font-size:.6rem;color:var(--dim);text-align:right;margin-top:4px}
#noRes{text-align:center;padding:50px 20px;color:var(--dim);display:none}
.fab{position:fixed;bottom:24px;right:18px;width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--darker);font-size:1.2rem;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(240,192,64,.35);z-index:200;transition:transform .2s}
.fab:hover{transform:scale(1.1)}
</style>
</head>

let currentCat = 'all';
let currentRole = 'all';
const seenSlugs = new Set();

function buildCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  seenSlugs.clear();
  let count = 0;
  const query = document.getElementById('search').value.toLowerCase();

  ITEMS.forEach((item, idx) => {
    const [slug, nameEN, nameRU, cost, tier, cat, stats, roles, when, detail] = item;
    if (seenSlugs.has(slug)) return;
    seenSlugs.add(slug);

    const catMatch = currentCat === 'all' || cat === currentCat;
    const roleMatch = currentRole === 'all' || roles.includes(currentRole) || roles.includes('all');
    const searchMatch = !query || nameEN.toLowerCase().includes(query) || nameRU.toLowerCase().includes(query) || when.toLowerCase().includes(query) || (detail && detail.toLowerCase().includes(query));

    if (!catMatch || !roleMatch || !searchMatch) return;
    count++;

    const tierClass = tier === 'T3' ? 't3' : tier === 'T2' ? 't2' : 't1';
    const tagMap = {mm:'tag-mm',fighter:'tag-fighter',ass:'tag-ass',mage:'tag-mage',tank:'tag-tank',sup:'tag-sup',jng:'tag-jng'};
    const labelMap = {mm:'MM',fighter:'Fighter',ass:'Assassin',mage:'Mage',tank:'Tank',sup:'Support',jng:'Jungle'};
    const tagsHTML = roles.filter(r=>r!=='all').map(r=>`<span class="tag ${tagMap[r]||''}">${labelMap[r]||r}</span>`).join('');

    const imgSrc = `${IMG}${slug}.png`;
    const costLabel = cost > 0 ? `💰 ${cost}` : '🆓';
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = cat;
    card.style.animationDelay = `${Math.min((count-1)*0.025, 0.5)}s`;
    card.onclick = () => card.classList.toggle('open');
    card.innerHTML = `
      <div class="item-icon">
        <img src="${imgSrc}" alt="${nameEN}" onerror="this.parentElement.innerHTML='🎁'">
      </div>
      <div class="card-body">
        <div class="card-top">
          <span class="iname">${nameEN}</span>
          <span class="icost">${costLabel}</span>
        </div>
        <div class="iname-ru">${nameRU}</div>
        <div class="istats"><span class="tier ${tierClass}">${tier}</span>${stats}</div>
        <div class="when">${when}</div>
        <div class="tags">${tagsHTML}</div>
        <div class="detail">${detail}</div>
        <div class="hint">нажми для деталей ▾</div>
      </div>`;
    grid.appendChild(card);
  });

  document.getElementById('cnt').textContent = count;
  document.getElementById('noRes').style.display = count === 0 ? 'block' : 'none';
}

function setCategory(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildCards();
}

function setRole(role, btn) {
  currentRole = role;
  document.querySelectorAll('.rf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildCards();
}

buildCards();
</script>
